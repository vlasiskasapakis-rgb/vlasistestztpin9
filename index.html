<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Διαδρομή μνήμης — Μυτιλήνη</title>

<!--
  WALKING MEMORY (GA 101288157) — spike για το Task 4.2.
  Ένα αρχείο. Ανεβάζεις σε GitHub Pages και παίζει.

  ΑΠΑΙΤΕΙ HTTPS.
-->

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

<style>
  :root {
    --ink: #0E2A2E; --bone: #F2EDE4; --chalk: #F0C244;
    --sea: #4E8C93; --pad: 16px;
    --handle: calc(52px + env(safe-area-inset-bottom));
  }
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
    background: var(--ink); color: var(--bone);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", "Noto Sans", sans-serif;
    font-size: 17px; line-height: 1.5; -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 2px; }
  button:focus-visible { outline: 3px solid var(--chalk); outline-offset: 3px; }
  img.labelsrc { display: none; }
  a-scene, a-scene .a-canvas { position: fixed !important; inset: 0 !important;
                               width: 100% !important; height: 100% !important; z-index: 0; }

  #gate {
    position: fixed; inset: 0; z-index: 40;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 32px; padding-bottom: calc(32px + env(safe-area-inset-bottom));
    background: radial-gradient(120% 80% at 50% 0%, #14454B 0%, var(--ink) 70%);
  }
  #gate h1 {
    font-size: 30px; line-height: 1.15; font-weight: 600;
    letter-spacing: -0.01em; margin: 0 0 12px; max-width: 15ch;
  }
  #gate .rule { height: 2px; width: 44px; background: var(--chalk); margin: 0 0 22px; }
  #gate p { margin: 0 0 6px; max-width: 40ch; font-size: 15px; color: rgba(242,237,228,.72); }
  #startBtn {
    margin-top: 26px; width: 100%; padding: 17px;
    background: var(--chalk); color: var(--ink); font-size: 18px; font-weight: 600;
  }
  #startBtn[disabled] { opacity: .5; }

  #hud { position: fixed; inset: 0; z-index: 20; pointer-events: none; display: none; }
  #hud.on { display: block; }
  #status {
    position: absolute; top: calc(var(--pad) + env(safe-area-inset-top));
    left: var(--pad); right: var(--pad); padding: 9px 13px;
    background: rgba(14,42,46,.92); font-size: 14px; font-variant-numeric: tabular-nums;
  }
  #drawer {
    position: fixed; left: 0; right: 0; bottom: 0; height: 52%;
    z-index: 15; display: flex; flex-direction: column;
    transform: translateY(calc(100% - var(--handle)));
    transition: transform .28s cubic-bezier(.32,.72,0,1);
    will-change: transform;
  }
  #drawer.open { transform: translateY(0); }

  #handle {
    flex: none; height: var(--handle); width: 100%;
    display: flex; align-items: center; gap: 11px;
    padding: 0 var(--pad);
    background: var(--ink); color: var(--bone);
    border-top: 3px solid var(--chalk);
    text-align: left; touch-action: none;
  }
  #handle .grip {
    width: 34px; height: 4px; border-radius: 2px;
    background: rgba(242,237,228,.45); flex: none;
  }
  #handle .lbl { font-size: 15px; font-weight: 600; }
  #handle .hint { font-size: 13px; color: #8FC0C4; margin-left: auto; }

  #map { flex: 1; background: #0A1F22; }

  .leaflet-container { background: #0A1F22; font-family: inherit; }
  .leaflet-control-attribution {
    background: rgba(14,42,46,.85) !important; color: #B9CFD1 !important;
    font-size: 10px !important;
  }
  .leaflet-control-attribution a { color: var(--chalk) !important; }

  #compass {
    position: absolute; top: calc(var(--handle) + 10px); right: 10px; z-index: 500;
    width: 54px; height: 54px; border-radius: 50%;
    background: rgba(14,42,46,.92); color: var(--bone);
    display: flex; align-items: center; justify-content: center;
  }
  #compass .needle {
    position: absolute; inset: 0; transform-origin: 50% 50%;
  }
  #compass .needle::before {
    content: ''; position: absolute; left: 50%; top: 8px;
    transform: translateX(-50%);
    width: 0; height: 0; border-left: 7px solid transparent;
    border-right: 7px solid transparent; border-bottom: 19px solid var(--chalk);
  }
  #compass .needle::after {
    content: ''; position: absolute; left: 50%; bottom: 12px;
    transform: translateX(-50%);
    width: 0; height: 0; border-left: 7px solid transparent;
    border-right: 7px solid transparent; border-top: 19px solid rgba(242,237,228,.28);
  }
  #compass .deg {
    position: absolute; bottom: 3px; left: 0; right: 0; text-align: center;
    font-size: 10px; font-variant-numeric: tabular-nums; color: #8FC0C4;
  }

  .me-wrap { position: relative; width: 56px; height: 56px; }
  .me-rot  { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .me-cone {
    position: absolute; left: 50%; bottom: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 17px solid transparent;
    border-right: 17px solid transparent;
    border-top: 30px solid rgba(240, 194, 68, 0.88);
    filter: drop-shadow(0 0 2px rgba(14, 42, 46, 0.95));
  }
  .me-rot.unknown .me-cone { display: none; }
  .me-dot {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--chalk); border: 3px solid var(--ink);
  }
  .poi-dot {
    width: 13px; height: 13px; border-radius: 50%;
    background: var(--bone); border: 3px solid var(--sea);
  }

  #nearest {
    position: absolute; left: var(--pad); right: var(--pad);
    bottom: calc(var(--handle) + var(--pad));
    transition: bottom .28s cubic-bezier(.32,.72,0,1);
    pointer-events: auto; display: none; width: calc(100% - var(--pad)*2);
    text-align: left; padding: 15px 17px; background: var(--bone);
    color: var(--ink); border-left: 5px solid var(--chalk);
  }
  #nearest.on { display: block; }
  body.drawer-open #nearest { bottom: calc(52% + var(--pad)); }
  #nearest .dist {
    display: block; font-size: 14px; color: var(--sea);
    font-variant-numeric: tabular-nums; margin-bottom: 2px;
  }
  #nearest .name { display: block; font-size: 19px; font-weight: 600; }

  #sheet {
    position: fixed; inset: 0; z-index: 30; display: none;
    flex-direction: column; justify-content: flex-end; background: rgba(14,42,46,.55);
  }
  #sheet.on { display: flex; }
  #sheetInner {
    background: var(--bone); color: var(--ink);
    padding: 26px var(--pad) calc(26px + env(safe-area-inset-bottom));
    max-height: 78%; overflow-y: auto;
  }
  #sheetInner h2 { margin: 0 0 3px; font-size: 25px; font-weight: 600; }
  #sheetInner .sub { margin: 0 0 18px; color: var(--sea); font-size: 15px; }
  #sheetInner .body { margin: 0 0 22px; max-width: 62ch; }
  #closeBtn { padding: 14px 22px; background: var(--ink); color: var(--bone); font-size: 16px; }
  .note {
    display: inline-block; margin-bottom: 16px; padding: 5px 9px;
    background: rgba(78,140,147,.16); color: var(--sea); font-size: 13px;
  }
  @media (prefers-reduced-motion: reduce) {
    #drawer, #nearest { transition: none !important; }
  }
</style>
</head>
<body>

<div id="gate">
  <h1>Διαδρομή μνήμης, κέντρο Μυτιλήνης</h1>
  <div class="rule"></div>
  <p>Άγιος Θεράπων, Πλατεία Σαπφούς, ΙΚΑ στην Επάνω Σκάλα.</p>
  <p>Χρειάζεται κάμερα, τοποθεσία και αισθητήρες κίνησης. Δούλεψε σε ανοιχτό χώρο.</p>
  <button id="startBtn" type="button">Ξεκίνα τη διαδρομή</button>
</div>

<div id="hud">
  <div id="status" role="status" aria-live="polite">Αναμονή για στίγμα…</div>
  <button id="nearest" type="button">
    <span class="dist"></span><span class="name"></span>
  </button>
</div>

<div id="drawer">
  <button id="handle" type="button" aria-expanded="false" aria-controls="map">
    <span class="grip" aria-hidden="true"></span>
    <span class="lbl">Χάρτης</span>
    <span class="hint">σύρε πάνω</span>
  </button>
  <div id="map" aria-label="Χάρτης διαδρομής">
    <div id="compass" aria-hidden="true"><span class="needle"></span><span class="deg">—</span></div>
  </div>
</div>

<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div id="sheetInner">
    <span class="note">Δοκιμαστικό κείμενο, όχι μαρτυρία</span>
    <h2 id="sheetTitle"></h2>
    <p class="sub"></p>
    <p class="body"></p>
    <button id="closeBtn" type="button">Κλείσιμο</button>
  </div>
</div>


<script>
(function () {
  'use strict';

  var STORIES = [
    {
      id: 'therapon', title: 'Άγιος Θεράπων', subtitle: 'Ερμού, παλιά αγορά',
      lat: 39.1051514, lon: 26.5547650, radius: 35,
      text: 'Δοκιμαστικό κείμενο για τον έλεγχο της ροής ανάγνωσης. Εδώ θα ' +
            'εμφανιζόταν η αφήγηση που έχει συνδεθεί με το σημείο, μαζί με ' +
            'τα μεταδεδομένα της και τον συντελεστή που την κατέθεσε.'
    },
    {
      id: 'sapfous', title: 'Πλατεία Σαπφούς', subtitle: 'Παραλιακή',
      lat: 39.1066446, lon: 26.5574660, radius: 40,
      text: 'Δεύτερο δοκιμαστικό σημείο, περίπου 285 μ. από τον Άγιο ' +
            'Θεράποντα. Μεσαία απόσταση, χρήσιμη για σύγκριση.'
    },
    {
      id: 'ika', title: 'ΙΚΑ', subtitle: 'Ναυμαχίας Έλλης, Επάνω Σκάλα',
      lat: 39.1118710, lon: 26.5566432, radius: 40,
      text: 'Τρίτο δοκιμαστικό σημείο, περίπου 585 μ. από την Πλατεία ' +
            'Σαπφούς. Ελέγχει αν η ετικέτα παραμένει ευανάγνωστη σε ' +
            'μεγάλη απόσταση.'
    }
  ];

  var params = new URLSearchParams(location.search);
  var SMOOTHING = parseFloat(params.get('k')) || 0.1;
  var MIN_DIST  = parseFloat(params.get('d')) || 5;
  var Y_OFF = params.has('y') ? parseFloat(params.get('y')) : 0.55;

  var CAL_KEY = 'wm-compass-cal';
  function loadCal() {
    if (params.has('cal')) { return parseFloat(params.get('cal')) || 0; }
    try {
      var v = window.localStorage.getItem(CAL_KEY);
      return v === null ? null : parseFloat(v);
    } catch (e) {
      return null;
    }
  }
  function saveCal(v) {
    try { window.localStorage.setItem(CAL_KEY, String(v)); } catch (e) { /* αδιάφορο */ }
  }

  var CAL = loadCal();
  var calAuto = (CAL === null);

  var $ = function (id) { return document.getElementById(id); };
  var me = null, lastFocus = null;

  function distanceMetres(lat1, lon1, lat2, lon2) {
    var R = 6371000, rad = function (d) { return d * Math.PI / 180; };
    var dLat = rad(lat2 - lat1), dLon = rad(lon2 - lon1);
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(rad(lat1)) * Math.cos(rad(lat2)) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  function fmt(m) {
    return m < 1000 ? Math.round(m) + ' μ.' : (m / 1000).toFixed(1) + ' χλμ.';
  }

  var _camPos = new THREE.Vector3();
  AFRAME.registerComponent('billboard', {
    tick: function () {
      var cam = this.el.sceneEl && this.el.sceneEl.camera;
      if (!cam) { return; }
      cam.getWorldPosition(_camPos);
      var o = this.el.object3D;
      o.lookAt(_camPos.x, o.position.y, _camPos.z);
    }
  });

  function makeLabelImage(story) {
    var W = 900, H = 300, dpr = 2;
    var c = document.createElement('canvas');
    c.width = W * dpr; c.height = H * dpr;
    var g = c.getContext('2d');
    g.scale(dpr, dpr);

    g.fillStyle = 'rgba(14,42,46,0.90)';
    g.fillRect(0, 0, W, H);
    g.fillStyle = '#F0C244';
    g.fillRect(0, 0, 14, H);

    g.fillStyle = '#F2EDE4';
    g.font = '600 82px -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif';
    g.textBaseline = 'middle';
    g.fillText(story.title, 52, H / 2 - 26);

    g.fillStyle = '#8FC0C4';
    g.font = '46px -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif';
    g.fillText(story.subtitle, 52, H / 2 + 50);

    var img = document.createElement('img');
    img.id = 'lbl-' + story.id;
    img.className = 'labelsrc';
    img.src = c.toDataURL('image/png');
    document.body.appendChild(img);
    return img.id;
  }

  function buildScene() {
    var parts = [];
    STORIES.forEach(function (s) {
      var imgId = makeLabelImage(s);
      parts.push(
        '<a-entity class="poi" data-id="' + s.id + '" ' +
        'gps-new-entity-place="latitude: ' + s.lat + '; longitude: ' + s.lon + '" ' +
        'billboard scale="5 5 1">' +
          '<a-plane width="3" height="1" position="0 ' + Y_OFF + ' 0" ' +
          'material="src: #' + imgId + '; transparent: true; shader: flat; side: double">' +
          '</a-plane>' +
        '</a-entity>'
      );
    });
    parts.push(
      '<a-camera id="cam" ' +
      'look-controls-enabled="false" ' +
      'arjs-device-orientation-controls="smoothingFactor: ' + SMOOTHING + '" ' +
      'gps-new-camera="gpsMinDistance: ' + MIN_DIST + '"></a-camera>'
    );

    var scene = document.createElement('a-scene');
    scene.setAttribute('vr-mode-ui', 'enabled: false');
    scene.setAttribute('loading-screen', 'enabled: false');
    scene.setAttribute('arjs', 'sourceType: webcam; videoTexture: true; debugUIEnabled: false');
    scene.setAttribute('renderer', 'antialias: true; alpha: true');
    scene.innerHTML = parts.join('');
    document.body.appendChild(scene);
  }

  var scaled = false;
  function scaleLabels() {
    if (scaled || !me) return;
    STORIES.forEach(function (s) {
      var el = document.querySelector('.poi[data-id="' + s.id + '"]');
      if (!el) return;
      var d = distanceMetres(me.lat, me.lon, s.lat, s.lon);
      var k = Math.max(d, 25) * 0.09;
      el.setAttribute('scale', k + ' ' + k + ' 1');
    });
    scaled = true;
  }

  var map = null, meMarker = null, accCircle = null, followMe = true;

  function initMap() {
    map = L.map('map', {
      zoomControl: true, attributionControl: true
    }).setView([STORIES[0].lat, STORIES[0].lon], 16);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    STORIES.forEach(function (s) {
      L.marker([s.lat, s.lon], {
        icon: L.divIcon({
          className: '', html: '<div class="poi-dot"></div>',
          iconSize: [13, 13], iconAnchor: [6, 6]
        }),
        title: s.title,
        alt: s.title
      }).addTo(map).on('click', function () { openStory(s); });
    });

    map.on('dragstart', function () { followMe = false; });
  }

  function updateMap() {
    if (!map || !me) { return; }
    var ll = [me.lat, me.lon];

    if (!meMarker) {
      meMarker = L.marker(ll, {
        icon: L.divIcon({
          className: '',
          html: '<div class="me-wrap"><div class="me-rot unknown">' +
                '<div class="me-cone"></div><div class="me-dot"></div>' +
                '</div></div>',
          iconSize: [56, 56], iconAnchor: [28, 28]
        }),
        title: 'Η θέση σου', alt: 'Η θέση σου', zIndexOffset: 1000
      }).addTo(map);
      accCircle = L.circle(ll, {
        radius: me.accuracy || 0, color: '#F0C244', weight: 1,
        fillColor: '#F0C244', fillOpacity: 0.10
      }).addTo(map);
      applyHeadingToDot();
    } else {
      meMarker.setLatLng(ll);
      accCircle.setLatLng(ll).setRadius(me.accuracy || 0);
    }
    if (followMe) { map.setView(ll, map.getZoom(), { animate: false }); }
  }

  var AUTO_MIN_SPEED = 1.2;
  var AUTO_MAX_ACC   = 30;
  var AUTO_SAMPLES   = 8;
  var sumSin = 0, sumCos = 0, nSamples = 0;

  function autoCalibrate(coords) {
    if (!calAuto || rawHeading === null) { return; }
    if (coords.speed === null || coords.speed < AUTO_MIN_SPEED) { return; }
    if (coords.heading === null || isNaN(coords.heading)) { return; }
    if (coords.accuracy > AUTO_MAX_ACC) { return; }

    var off = ((coords.heading - rawHeading + 540) % 360) - 180;
    
    sumSin += Math.sin(off * Math.PI / 180);
    sumCos += Math.cos(off * Math.PI / 180);
    nSamples++;

    if (nSamples >= AUTO_SAMPLES) {
      var mean = Math.atan2(sumSin, sumCos) * 180 / Math.PI;
      CAL = Math.round(mean * 10) / 10;
      calAuto = false;
      saveCal(CAL);
      applyHeadingToDot();
    }
  }

  function autoProgress() {
    if (!calAuto) { return ''; }
    return nSamples > 0
      ? '   βαθμονόμηση ' + nSamples + '/' + AUTO_SAMPLES
      : '   περπάτα ευθεία για βαθμονόμηση';
  }

  function applyHeadingToDot() {
    if (!meMarker) { return; }
    var elm = meMarker.getElement();
    if (!elm) { return; }
    var rot = elm.querySelector('.me-rot');
    if (!rot) { return; }
    if (heading === null) { rot.classList.add('unknown'); return; }
    rot.classList.remove('unknown');
    rot.style.transform = 'rotate(' + heading + 'deg)';
  }

  function setDrawer(open) {
    var d = $('drawer'), hd = $('handle');
    d.classList.toggle('open', open);
    document.body.classList.toggle('drawer-open', open);
    hd.setAttribute('aria-expanded', open ? 'true' : 'false');
    hd.querySelector('.hint').textContent = open ? 'σύρε κάτω' : 'σύρε πάνω';
    if (map) {
      map.invalidateSize();
      setTimeout(function () { map.invalidateSize(); if (open) { updateMap(); } }, 300);
    }
  }

  function initDrawer() {
    var hd = $('handle');
    var startY = null, moved = false;

    hd.addEventListener('click', function () {
      if (moved) { moved = false; return; }
      setDrawer(!$('drawer').classList.contains('open'));
    });

    hd.addEventListener('pointerdown', function (e) {
      startY = e.clientY; moved = false;
      hd.setPointerCapture(e.pointerId);
    });

    hd.addEventListener('pointermove', function (e) {
      if (startY === null) { return; }
      if (Math.abs(e.clientY - startY) > 12) { moved = true; }
    });

    hd.addEventListener('pointerup', function (e) {
      if (startY === null) { return; }
      var dy = e.clientY - startY;
      if (Math.abs(dy) > 24) { setDrawer(dy < 0); }
      startY = null;
    });
  }

  var heading = null;
  var needle = null, degOut = null;

  function readHeading(e) {
    if (typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)) {
      return e.webkitCompassHeading;
    }
    if (e.absolute === true && typeof e.alpha === 'number') {
      return (360 - e.alpha) % 360;
    }
    return null;
  }

  function screenAngle() {
    if (screen.orientation && typeof screen.orientation.angle === 'number') {
      return screen.orientation.angle;
    }
    return window.orientation || 0;
  }

  var rawSeen = '';
  var rawHeading = null;
  function onOrientation(e) {
    var hd = readHeading(e);
    if (params.has('debug')) {
      rawSeen =
        (typeof e.webkitCompassHeading === 'number'
          ? 'wk ' + Math.round(e.webkitCompassHeading)
          : 'a ' + (e.alpha === null ? '—' : Math.round(e.alpha)) +
            '/' + (e.absolute ? 'abs' : 'rel')) +
        ' scr ' + screenAngle();
    }
    if (hd === null) { return; }
    rawHeading = (hd + screenAngle()) % 360;
    heading = (rawHeading + (CAL || 0) + 360) % 360;
    if (!needle) {
      needle = document.querySelector('#compass .needle');
      degOut = document.querySelector('#compass .deg');
    }
    needle.style.transform = 'rotate(' + (-heading) + 'deg)';
    degOut.textContent = Math.round(heading) + '°';
    applyHeadingToDot();
  }

  function listenHeading() {
    window.addEventListener('deviceorientationabsolute', onOrientation, true);
    window.addEventListener('deviceorientation', onOrientation, true);
  }

  function onPosition(pos) {
    me = {
      lat: pos.coords.latitude,
      lon: pos.coords.longitude,
      accuracy: pos.coords.accuracy
    };
    scaleLabels();
    updateMap();
    autoCalibrate(pos.coords);

    var dbg = params.has('debug')
      ? '   ετικέτες ' + document.querySelectorAll('.poi').length + '   ' + rawSeen
      : '';
    $('status').textContent =
      'στίγμα ±' + Math.round(me.accuracy) + ' μ.   ' +
      'πυξίδα ' + (heading === null ? '—' : Math.round(heading) + '°') +
      (CAL ? '  (διόρθ. ' + (CAL > 0 ? '+' : '') + CAL + '°)' : '') +
      autoProgress() + dbg;

    var ranked = STORIES.map(function (s) {
      return { s: s, d: distanceMetres(me.lat, me.lon, s.lat, s.lon) };
    }).sort(function (a, b) { return a.d - b.d; });

    var c = ranked[0], btn = $('nearest');
    btn.querySelector('.dist').textContent =
      c.d <= c.s.radius ? 'Είσαι εδώ' : fmt(c.d) + ' μακριά';
    btn.querySelector('.name').textContent = c.s.title;
    btn.classList.add('on');
    btn.onclick = function () { openStory(c.s); };
  }

  function openStory(s) {
    lastFocus = document.activeElement;
    $('sheetTitle').textContent = s.title;
    $('sheet').querySelector('.sub').textContent = s.subtitle;
    $('sheet').querySelector('.body').textContent = s.text;
    $('sheet').classList.add('on');
    $('closeBtn').focus();
  }
  $('closeBtn').addEventListener('click', function () {
    $('sheet').classList.remove('on');
    if (lastFocus) lastFocus.focus();
  });

  $('startBtn').addEventListener('click', function () {
    var btn = $('startBtn');
    btn.disabled = true;
    btn.textContent = 'Άνοιγμα κάμερας…';

    var perm = (window.DeviceOrientationEvent &&
                typeof DeviceOrientationEvent.requestPermission === 'function')
      ? DeviceOrientationEvent.requestPermission()
      : Promise.resolve('granted');

    perm.then(function (state) {
      if (state !== 'granted') {
        throw new Error('Δεν δόθηκε άδεια για τους αισθητήρες κίνησης.');
      }
      buildScene();
      $('gate').style.display = 'none';
      $('hud').classList.add('on');
      initMap();
      initDrawer();
      listenHeading();

      if (!navigator.geolocation) {
        $('status').textContent = 'Η συσκευή δεν δίνει τοποθεσία.';
        return;
      }
      navigator.geolocation.watchPosition(
        onPosition,
        function (err) {
          $('status').textContent =
            'Δεν βρέθηκε στίγμα (κωδικός ' + err.code + '). Βγες σε ανοιχτό χώρο.';
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 }
      );
    }).catch(function (e) {
      btn.disabled = false;
      btn.textContent = 'Δοκίμασε ξανά';
      $('gate').querySelector('p').textContent =
        'Δεν ξεκίνησε: ' + (e.message || e) +
        ' Η σελίδα πρέπει να τρέχει σε HTTPS και να έχεις δώσει άδεια για ' +
        'κάμερα, τοποθεσία και αισθητήρες.';
    });
  });
})();
</script>
</body>
</html>
